name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source ref to check when called by a release workflow
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Keep reusable CI distinct from the calling release workflow's group.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            printf 'Run gofmt on:\n%s\n' "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Test release packaging helpers
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test with race detector
        env:
          # Avoid competing subprocess-heavy packages on the macOS runner.
          GOFLAGS: ${{ runner.os == 'macOS' && '-p=1' || '' }}
        run: go test -race -count=1 -timeout=5m ./...
      - name: Build and check binary
        run: |
          go build -trimpath -o "$RUNNER_TEMP/errand" ./cmd/errand
          "$RUNNER_TEMP/errand" version
      - name: Rehearse release packaging
        if: runner.os == 'Linux' && !startsWith(inputs.ref || github.ref, 'refs/tags/')
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.0
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check generated Homebrew formula
        if: runner.os == 'Linux' && !startsWith(inputs.ref || github.ref, 'refs/tags/')
        run: |
          version=$(python3 -c 'import json; print(json.load(open("dist/metadata.json"))["version"])')
          python3 scripts/homebrew_formula.py "$version" "dist/errand_${version}_source.tar.gz" dist/errand.rb
          ruby -c dist/errand.rb
          cd dist
          sha256sum --check checksums.txt
