version: 2
project_name: errand

builds:
  - id: errand
    main: ./cmd/errand
    binary: errand
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - ids: [errand]
    formats: [tar.gz]
    name_template: "errand_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [LICENSE, README.md]

source:
  enabled: true
  name_template: "errand_{{ .Version }}_source"
  prefix_template: "errand_{{ .Version }}/"

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ .Version }}-dev"

# The workflow adds the generated source formula before creating a draft.
release:
  disable: true
